services:
  icecast-exporter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Proxy solo para el build (si hace falta bajar dependencias Go)
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: ls11-icecast-exporter:latest
    container_name: ls11-icecast-exporter-${SERVICE_NAME:-icecast}
    environment:
      # Configuración propia del exporter (sin proxy en runtime)
      - ICECAST_URL=${ICECAST_URL}
      - ICECAST_USERNAME=${ICECAST_USERNAME:-admin}
      - ICECAST_PASSWORD=${ICECAST_PASSWORD:-hackme}
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-30s}
      - WEB_LISTEN_ADDRESS=${WEB_LISTEN_ADDRESS:-:9146}
      - WEB_TELEMETRY_PATH=${WEB_TELEMETRY_PATH:-/metrics}
    ports:
      - "${PORT:-9146}:9146"
    restart: unless-stopped
    extra-hosts:
      - "streaming.provinciaradio.com.ar:${ICECAST_INTERNAL_IP}"
    command:
      - -icecast.scrape-uri
      - '${ICECAST_URL}'
      - -icecat.timeout
      - ${SCRAPE_INTERVAL:-30s}
      - -web-listen-address=:9146
      - -web.telemetry-path=${WEB_TELEMETRY_PATH:-/metrics}